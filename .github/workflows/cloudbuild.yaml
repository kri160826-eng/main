substitutions:
  _REGION: us-central1
  _AR_REPO: cloud-run-apps
  _ADK_SERVICE: dm-agent
  _STREAMLIT_SERVICE: streamlit-ui

steps:
  # Build ADK Agent image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ADK_SERVICE}:$COMMIT_SHA
      - apps/dm_agent

  # Push ADK Agent image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ADK_SERVICE}:$COMMIT_SHA

  # Deploy ADK Agent to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ADK_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ADK_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --timeout=300

  # Build Streamlit image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_STREAMLIT_SERVICE}:$COMMIT_SHA
      - apps/streamlit_ui

  # Push Streamlit image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_STREAMLIT_SERVICE}:$COMMIT_SHA

  # Deploy Streamlit to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_STREAMLIT_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_STREAMLIT_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --set-env-vars=ADK_AGENT_URL=https://dm-agent-xxxxx-uc.a.run.app

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_ADK_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_STREAMLIT_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
