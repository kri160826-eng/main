# cloudbuild.yaml
# Build -> push -> deploy to Cloud Run.
# NO hardcoded config lives here. Every value comes in as a _SUBSTITUTION,
# injected from config.json by setup.ps1 (trigger) or deploy.ps1 (manual).
#
# Substitutions expected (all sourced from config.json):
#   _PROJECT_ID _REGION _AR_HOST _REPO _SERVICE _SOURCE_DIR
#   _PORT _MEMORY _CPU _MIN_INSTANCES _MAX_INSTANCES _ALLOW_UNAUTH _ENV_VARS
#
# Note: Cloud Build substitutes ${_VAR} and $SHORT_SHA before the shell runs.
# Runtime bash variables are escaped as $$VAR so Cloud Build leaves them alone.

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

steps:
  # 1. Build. Tag = commit SHA when triggered, else a timestamped manual tag.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG="${SHORT_SHA}"
        if [ -z "$$TAG" ]; then TAG="manual-$$(date +%Y%m%d-%H%M%S)"; fi
        echo -n "$$TAG" > /workspace/_tag
        IMAGE="${_AR_HOST}/${_PROJECT_ID}/${_REPO}/${_SERVICE}"
        echo "Building $$IMAGE:$$TAG"
        docker pull "$$IMAGE:latest" || true
        docker build \
          --cache-from "$$IMAGE:latest" \
          -t "$$IMAGE:$$TAG" \
          -t "$$IMAGE:latest" \
          "${_SOURCE_DIR}"

  # 2. Push both tags to Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE="${_AR_HOST}/${_PROJECT_ID}/${_REPO}/${_SERVICE}"
        docker push "$$IMAGE:$$(cat /workspace/_tag)"
        docker push "$$IMAGE:latest"

  # 3. Deploy the immutable :$TAG image to Cloud Run.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        IMAGE="${_AR_HOST}/${_PROJECT_ID}/${_REPO}/${_SERVICE}"
        TAG="$$(cat /workspace/_tag)"
        FLAGS=(
          run deploy "${_SERVICE}"
          --image="$$IMAGE:$$TAG"
          --project="${_PROJECT_ID}"
          --region="${_REGION}"
          --platform=managed
          --port="${_PORT}"
          --memory="${_MEMORY}"
          --cpu="${_CPU}"
          --min-instances="${_MIN_INSTANCES}"
          --max-instances="${_MAX_INSTANCES}"
          --quiet
        )
        if [ "${_ALLOW_UNAUTH}" = "true" ]; then
          FLAGS+=(--allow-unauthenticated)
        else
          FLAGS+=(--no-allow-unauthenticated)
        fi
        if [ -n "${_ENV_VARS}" ]; then
          FLAGS+=(--set-env-vars="${_ENV_VARS}")
        fi
        gcloud "$${FLAGS[@]}"

timeout: 1200s
