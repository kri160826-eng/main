# cloudbuild.yaml — build, push, deploy to Cloud Run.
# Self-contained: reads config.json from the repo at build time, so the trigger
# needs NO substitutions. Every dynamic value lives in config.json.
#
# Runtime bash variables are escaped as $$VAR; only $SHORT_SHA (a Cloud Build
# builtin) is left as a single $ for Cloud Build to substitute.

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

steps:
  # 0. Parse config.json -> /workspace/vars.env
  - id: config
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        CFG="$(find . -name config.json | grep -m1 -i deploy || find . -name config.json | head -1)"
        [ -f "$$CFG" ] || { echo "config.json not found"; exit 1; }
        echo "Using config: $$CFG"
        python3 - "$$CFG" > /workspace/vars.env <<'PY'
        import json, sys
        c = json.load(open(sys.argv[1]))
        s, ar = c["service"], c["artifactRegistry"]
        env = s.get("envVars") or {}
        vals = {
          "PROJECT_ID": c["project"]["id"],
          "REGION": c["region"],
          "AR_HOST": f'{ar["location"]}-docker.pkg.dev',
          "AR_REPO": ar["repo"],
          "SERVICE": s["name"],
          "SOURCE_DIR": s["sourceDir"],
          "PORT": s["port"],
          "MEMORY": s["memory"],
          "CPU": s["cpu"],
          "MIN_INSTANCES": s["minInstances"],
          "MAX_INSTANCES": s["maxInstances"],
          "ALLOW_UNAUTH": str(s["allowUnauthenticated"]).lower(),
          "ENV_VARS": ",".join(f"{k}={v}" for k, v in env.items()),
        }
        for k, v in vals.items():
            print(f'export {k}="{v}"')
        PY
        echo "---- resolved ----"; cat /workspace/vars.env

  # 1. Build
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        source /workspace/vars.env
        TAG="${SHORT_SHA}"; [ -n "$$TAG" ] || TAG="manual-$$(date +%Y%m%d-%H%M%S)"
        echo -n "$$TAG" > /workspace/_tag
        IMAGE="$$AR_HOST/$$PROJECT_ID/$$AR_REPO/$$SERVICE"
        echo "Building $$IMAGE:$$TAG (context: $$SOURCE_DIR)"
        docker pull "$$IMAGE:latest" || true
        docker build --cache-from "$$IMAGE:latest" \
          -t "$$IMAGE:$$TAG" -t "$$IMAGE:latest" "$$SOURCE_DIR"

  # 2. Push
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        source /workspace/vars.env
        IMAGE="$$AR_HOST/$$PROJECT_ID/$$AR_REPO/$$SERVICE"
        docker push "$$IMAGE:$$(cat /workspace/_tag)"
        docker push "$$IMAGE:latest"

  # 3. Deploy
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        source /workspace/vars.env
        IMAGE="$$AR_HOST/$$PROJECT_ID/$$AR_REPO/$$SERVICE"
        FLAGS=(
          run deploy "$$SERVICE"
          --image="$$IMAGE:$$(cat /workspace/_tag)"
          --project="$$PROJECT_ID"
          --region="$$REGION"
          --platform=managed
          --port="$$PORT"
          --memory="$$MEMORY"
          --cpu="$$CPU"
          --min-instances="$$MIN_INSTANCES"
          --max-instances="$$MAX_INSTANCES"
          --quiet
        )
        if [ "$$ALLOW_UNAUTH" = "true" ]; then
          FLAGS+=(--allow-unauthenticated)
        else
          FLAGS+=(--no-allow-unauthenticated)
        fi
        [ -n "$$ENV_VARS" ] && FLAGS+=(--set-env-vars="$$ENV_VARS")
        gcloud "$${FLAGS[@]}"

timeout: 1200s
